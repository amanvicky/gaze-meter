[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaze-meter"
version = "0.1.0"
description = "Attention analytics from a webcam: blinks/min, gaze-off-center %, focus score"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Aman Elugam" }]

[project.optional-dependencies]
camera = ["mediapipe", "opencv-python"]

[project.scripts]
gaze-meter = "gaze_meter:main"
